<title>NOSTALGIA</title>
<style>
/* Layout: retro desktop. Fixed sky background, icon column on the left, two panels side by side (video | notepad or PFP maker). Nothing floats or overlaps; on phones everything stacks and the page scrolls. */
:root{
  --tb:46px;
  --sky:#1f6ff0; --xp:#0a5fd8; --xp-dark:#0a3fb0; --face:#ece9d8; --ink:#111111; --white:#ffffff;
  --task:#b4b4f2; --task-dark:#7d7dd8; --task-btn:#c9c9f8;
  --ui:Tahoma,Verdana,"Segoe UI",system-ui,sans-serif;
  --panel-h:min(calc(100vh - var(--tb) - 120px),520px);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ui);font-size:13px}
button{font-family:inherit}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--sky) url(desk.jpg) left bottom/cover no-repeat}

.screen{min-height:calc(100vh - var(--tb));box-sizing:border-box;display:grid;grid-template-columns:150px 1fr;gap:24px;padding:28px 24px calc(var(--tb) + 28px) 16px}
.icons{display:flex;flex-direction:column;gap:22px;align-items:center;align-self:start}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;width:120px;padding:6px 4px;border-radius:4px;background:none;border:0;cursor:pointer;color:var(--white);text-decoration:none}
.ico .g{width:64px;height:64px;display:block;filter:drop-shadow(1px 2px 0 rgba(0,0,40,.35));transition:transform .15s}
.ico .g svg,.ico .g img,.ico .g canvas{width:100%;height:100%;display:block}
.ico .l{font-weight:700;font-size:16px;line-height:1.15;text-align:center;text-shadow:-1px -1px 0 #0b1a52,1px -1px 0 #0b1a52,-1px 1px 0 #0b1a52,1px 1px 0 #0b1a52,0 2px 2px rgba(0,0,0,.4)}
.ico:hover .g{transform:translateY(-3px)}
.ico:focus-visible{outline:1px dotted var(--white);outline-offset:2px}
.ico.on .l{background:var(--xp);padding:0 4px}

.panels{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;align-self:center;min-width:0}
.win{background:var(--xp);border:3px solid var(--xp-dark);border-radius:9px 9px 4px 4px;padding:0 3px 3px;box-shadow:0 16px 44px rgba(0,0,40,.35);display:flex;flex-direction:column;min-width:0;max-width:100%;box-sizing:border-box}
.win[hidden]{display:none!important}
.tbar{display:flex;align-items:center;gap:6px;height:30px;padding:0 3px 0 8px;margin:0 -3px;color:var(--white);font-weight:700;font-size:13px;text-shadow:1px 1px 0 #0a2f80;background:linear-gradient(180deg,#3d95ff 0%,#0a5fd8 18%,#0553c4 80%,#0a46b0 100%);border-radius:6px 6px 0 0}
.tbar .ti{width:16px;height:16px;flex:none}
.tbar .ti svg{width:16px;height:16px;display:block}
.tbar .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb{width:22px;height:22px;border-radius:3px;border:1px solid var(--white);background:linear-gradient(180deg,#f08a6c,#d8401c);color:var(--white);font:700 12px/1 var(--ui);display:grid;place-items:center;cursor:pointer;padding:0}
.wb:focus-visible{outline:2px solid var(--white)}
.body{background:var(--face);border:1px solid var(--xp-dark);min-height:0;flex:1;display:flex;flex-direction:column}

/* video */
.vwrap{display:flex;flex-direction:column;width:min(var(--panel-h) - 90px,380px)}
.vid{width:100%;aspect-ratio:1;background:#000}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.cap{display:flex;align-items:baseline;gap:8px;padding:9px 10px 4px;font-size:15px;color:#0b1a52}
.cap b{font-family:"Trebuchet MS",Tahoma,sans-serif;font-size:17px}
.cap .yr{font-size:12px;color:#5a6280}
.cap .dot{width:9px;height:9px;border-radius:50%;background:#2fd06a;box-shadow:0 0 0 2px #c8f3d6;align-self:center;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.tape{overflow:hidden;white-space:nowrap;width:100%;border-top:1px solid #cfcbbb;padding:5px 0 7px;font:12px/1 Tahoma,Verdana,sans-serif;color:#333}
.tape .run{display:inline-flex;gap:22px;animation:tape 40s linear infinite;padding-left:10px}
.tape i{font-style:normal;color:#18a957}
.tape em{font-style:normal;color:#777}
@keyframes tape{to{transform:translateX(-50%)}}

/* right panel: same height as the video panel */
.side{width:440px;height:var(--side-h,auto)}
.side .body{overflow:hidden}
.np .menu{display:flex;gap:14px;padding:3px 8px;font-size:12px;color:#222;border-bottom:1px solid #cfcbbb}
.np .menu span:first-letter{text-decoration:underline}
.np .txt{flex:1;min-height:0;background:#fff;margin:0;padding:14px 16px;overflow-y:auto;font:13px/1.65 "Lucida Console",Consolas,"Courier New",monospace;color:#111;border:2px inset #cfcbbb}
.np .txt h3{font:700 15px/1.3 "Lucida Console",Consolas,monospace;margin:0 0 12px}
.np .txt p{margin:0 0 11px;max-width:60ch}
.np .txt .end{font-weight:700;margin:16px 0 2px}

/* pfp */
.pfp{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:170px 1fr;gap:12px;padding:10px;align-content:start}
.pfp canvas{width:100%;aspect-ratio:1;border:2px inset #cfcbbb;background:var(--white);display:block}
.pfp .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.opt{border:1px solid #d0cdbd;margin:0 0 6px;padding:2px 8px 7px;border-radius:3px;min-width:0}
.opt legend{font-weight:700;color:#1d3fa8;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:12px var(--ui);padding:3px 8px;border:1px solid #7f9db9;border-radius:3px;background:var(--white);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:#316ac5;color:var(--white);border-color:#1d3fa8}
.chip:focus-visible{outline:1px dotted var(--ink)}
.xpbtn{font:13px var(--ui);padding:4px 12px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(180deg,#fff,#ecebe6 85%,#d6d0c5);cursor:pointer;color:var(--ink)}
.xpbtn:hover{box-shadow:inset 0 0 0 2px #f8b33a}

.dexlogo{width:100%;height:100%;display:block;border-radius:22%;box-sizing:border-box;border:2px solid #fff;object-fit:cover}
.tbtn .dexlogo{width:16px;height:16px;border-width:1px;flex:none}

/* taskbar */
.task{position:fixed;left:0;right:0;bottom:0;height:var(--tb);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;gap:6px;padding-inline:4px;background:linear-gradient(180deg,#d7d7fb 0%,var(--task) 12%,var(--task) 85%,var(--task-dark) 100%);border-top:2px solid #e6e6ff;z-index:20}
.start{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 8px;font:700 17px var(--ui);color:#1a1a6e;background:linear-gradient(180deg,#e2e2fd,var(--task-btn));border:2px outset #e8e8ff;border-radius:3px;box-sizing:border-box}
.start svg{width:22px;height:22px}
.tasks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden;padding-left:4px;border-left:2px groove #e8e8ff}
.tbtn{display:flex;align-items:center;gap:6px;height:34px;min-width:0;max-width:200px;flex:0 1 200px;padding:0 10px;font:14px var(--ui);color:#1a1a6e;background:linear-gradient(180deg,#e2e2fd,var(--task-btn));border:2px outset #e8e8ff;border-radius:3px;cursor:pointer;white-space:nowrap}
.tbtn svg,.tbtn canvas{width:16px;height:16px;flex:none}
.tbtn span{overflow:hidden;text-overflow:ellipsis}
.tbtn.on{border-style:inset;background:#a7a7ec}
.clock{padding:0 12px;font:16px var(--ui);color:#1a1a6e;font-variant-numeric:tabular-nums;white-space:nowrap}

/* stacked layout */
@media (max-width:1060px){
  .screen{grid-template-columns:1fr;padding:16px 16px calc(var(--tb) + 24px)}
  .icons{flex-direction:row;justify-content:center;gap:8px;align-self:auto}
  .ico{width:104px}.ico .g{width:54px;height:54px}.ico .l{font-size:14px}
  .panels{flex-direction:column;align-items:center;align-self:auto}
  .vwrap,.side{width:min(440px,100%)}
  .side{height:auto}
  .np .txt{max-height:none;overflow:visible}
  .pfp{grid-template-columns:1fr}.pfp canvas{max-width:240px;margin:0 auto}
}
@media (max-width:520px){.tbtn span{display:none}.tbtn{flex:0 0 42px;justify-content:center;padding:0}.clock{font-size:14px;padding:0 6px}.start{font-size:15px;padding:0 10px 0 6px}}

/* ---- intro ---- */
.intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;color:#fff;font-family:var(--ui);transition:opacity .6s}
.intro.gone{opacity:0;pointer-events:none}
.boot{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:#000;cursor:pointer;transition:opacity .5s}
.boot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 6s ease-out both}
.boot .shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.1),rgba(0,0,0,.65));pointer-events:none}
.boot .word{position:relative;font:italic 900 clamp(46px,10vw,120px)/1 "Franklin Gothic Medium","Arial Black",Arial,sans-serif;letter-spacing:-.02em;background:linear-gradient(90deg,#ff3b3b,#ffb02e,#ffe23b,#3ee07a,#33b5ff,#8a5bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6));animation:wordin 1.4s cubic-bezier(.2,1,.3,1) .5s both}
.boot .skip{position:absolute;bottom:9vh;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.5);color:#fff;font:14px var(--ui);letter-spacing:.08em;padding:8px 16px;border-radius:999px;cursor:pointer;animation:fadein 1s 1.6s both,pulse 1.6s 2.6s ease-in-out infinite}
@keyframes zoom{from{transform:scale(1.15)}to{transform:scale(1)}}
@keyframes wordin{from{opacity:0;letter-spacing:.3em;transform:scale(.9)}}
.welcome{position:absolute;inset:0;display:none;flex-direction:column;background:#5a7edc}
.welcome.on{display:flex;animation:fadein .5s}
.welcome .top,.welcome .bot{height:12vh;min-height:60px;background:#00309c;border-bottom:2px solid #f28c28}
.welcome .bot{border-bottom:0;border-top:2px solid #f28c28;display:flex;align-items:center;padding:0 24px;font-size:14px;color:#cfe0ff}
.welcome .mid{flex:1;display:grid;grid-template-columns:1fr 2px 1fr;align-items:center;background:radial-gradient(circle at 25% 40%,#7fa4ec,#5a7edc 60%)}
.welcome .line{height:70%;background:linear-gradient(transparent,#c8d8ff,transparent)}
.welcome .l{justify-self:end;padding-right:40px;text-align:right}
.welcome .l b{display:block;font:italic 900 clamp(30px,5vw,54px)/1 "Franklin Gothic Medium","Arial Black",Arial,sans-serif;color:#fff}
.welcome .l span{font-size:clamp(14px,1.8vw,18px);color:#e2ecff}
.user{justify-self:start;margin-left:40px;display:flex;align-items:center;gap:16px;padding:10px 18px 10px 10px;border-radius:8px;border:0;background:transparent;color:#fff;cursor:pointer;font:clamp(18px,2.4vw,26px) var(--ui);text-align:left}
.user:hover,.user:focus-visible{background:linear-gradient(90deg,#0b3cb0,transparent);outline:none}
.user canvas{width:72px;height:72px;border:3px solid #f2c94c;border-radius:6px}
.user small{display:block;font-size:14px;color:#cfe0ff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
@keyframes fadein{from{opacity:0}}
@media (max-width:700px){.welcome .mid{grid-template-columns:1fr;align-content:center;gap:28px}.welcome .line{display:none}.welcome .l{justify-self:center;text-align:center;padding:0}.user{justify-self:center;margin:0}}

/* ---- desktop entrance ---- */
body.booting .ico,body.booting .win,body.booting .task{opacity:0}
body.enter .ico{animation:drop .5s cubic-bezier(.3,1.6,.5,1) both}
body.enter .ico:nth-child(2){animation-delay:.1s}body.enter .ico:nth-child(3){animation-delay:.2s}
body.enter #wVideo{animation:open .45s cubic-bezier(.2,1.2,.4,1) .25s both}
body.enter .side{animation:open .45s cubic-bezier(.2,1.2,.4,1) .4s both}
body.enter .task{animation:rise .4s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.7)}}
@keyframes open{from{opacity:0;transform:scale(.6) translateY(40px)}}
@keyframes rise{from{transform:translateY(100%)}}
.ico .g{animation:bob 4s ease-in-out infinite}
.ico:nth-child(2) .g{animation-delay:-1.3s}.ico:nth-child(3) .g{animation-delay:-2.6s}
@keyframes bob{50%{translate:0 -4px}}
.caret{display:inline-block;width:8px;height:14px;background:#111;vertical-align:-2px;animation:pulse 1s steps(1) infinite}
/* tray */
.tray{display:flex;align-items:center;gap:6px;padding-left:8px;border-left:2px groove #e8e8ff;height:34px}
.vol{width:30px;height:30px;border:0;background:none;cursor:pointer;padding:3px;border-radius:3px}
.vol:hover{background:rgba(255,255,255,.4)}
.vol svg{width:24px;height:24px;display:block}
.balloon{position:fixed;right:10px;bottom:calc(var(--tb) + 12px);z-index:25;width:250px;background:#ffffe1;border:1px solid #333;border-radius:8px;padding:10px 12px;font-size:12px;box-shadow:2px 3px 8px rgba(0,0,0,.3);animation:fadein .4s;transition:opacity .5s}
.balloon b{display:block;font-size:13px;margin-bottom:3px}
.balloon::after{content:"";position:absolute;right:30px;bottom:-12px;border:6px solid transparent;border-top-color:#ffffe1}
.balloon.hide{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="intro" id="intro">
  <div class="boot" id="boot">
    <video id="introVid" src="video.mp4#t=5" poster="poster.jpg" muted playsinline autoplay preload="auto" aria-hidden="true"></video>
    <div class="shade"></div>
    <div class="word">NOSTALGIA</div>
    <button class="skip" id="skip" type="button">click to enter · sound on</button>
  </div>
  <div class="welcome" id="welcome">
    <div class="top"></div>
    <div class="mid">
      <div class="l"><b>NOSTALGIA</b><span>To begin, click your trencher</span></div>
      <div class="line"></div>
      <button class="user" id="enter" type="button"><span id="uimg"></span><span>Trencher<small>click to enter 2024 · sound on</small></span></button>
    </div>
    <div class="bot">When we all held.</div>
  </div>
</div>

<div class="screen">
  <nav class="icons" id="icons" aria-label="Desktop"></nav>
  <main class="panels">
    <section class="win" id="wVideo" aria-label="nostalgia.mp4">
      <div class="tbar"><span class="ti" data-art="video"></span><span class="tt">nostalgia.mp4</span></div>
      <div class="body vwrap" id="vbody">
        <div class="vid"><video id="vid" src="video.mp4" poster="poster.jpg" muted loop playsinline controls preload="auto"></video></div>
        <div class="cap"><span class="dot"></span><b>when we all held</b><span class="yr">· solana 2024</span></div>
        <div class="tape" aria-hidden="true"><div class="run" id="tape"></div></div>
      </div>
    </section>
    <section class="win side np" id="wStory" aria-label="when_we_all_held.txt">
      <div class="tbar"><span class="ti" data-art="note"></span><span class="tt">when_we_all_held.txt - Notepad</span></div>
      <div class="body">
        <div class="menu" aria-hidden="true"><span>File</span><span>Edit</span><span>Format</span><span>View</span><span>Help</span></div>
        <div class="txt" id="story"></div>
      </div>
    </section>
    <section class="win side" id="wPfp" aria-label="PFP Maker" hidden>
      <div class="tbar"><span class="ti" data-art="pfp"></span><span class="tt">PFP Maker</span><button class="wb" id="pfpClose" aria-label="Close PFP Maker and show the story">✕</button></div>
      <div class="body">
        <div class="pfp">
          <div><canvas id="pc" width="512" height="512" aria-label="Your PFP"></canvas><div class="acts"><button class="xpbtn" id="prand" type="button">Random</button><button class="xpbtn" id="psave" type="button">Save PNG</button></div></div>
          <div id="popts"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<footer class="task">
  <span class="start" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17a9 9 0 0 1 18 0" fill="none" stroke="#ff3b3b" stroke-width="2.4"/><path d="M5.5 17a6.5 6.5 0 0 1 13 0" fill="none" stroke="#ffb02e" stroke-width="2.4"/><path d="M8 17a4 4 0 0 1 8 0" fill="none" stroke="#3ec26a" stroke-width="2.4"/><path d="M10.4 17a1.6 1.6 0 0 1 3.2 0" fill="none" stroke="#2f7cff" stroke-width="2.4"/></svg>Start</span>
  <div class="tasks" id="tasks"></div>
  <div class="tray"><button class="vol" id="vol" type="button" aria-label="Mute music"></button><div class="clock" id="clock"></div></div>
</footer>

<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  X_URL:   "https://x.com/",                 // your X / Twitter link
  DEX_URL: "https://dexscreener.com/solana"  // your DEX Screener link
};
/* ====================== */
const $=s=>document.querySelector(s);

const ART={
  x:`<svg viewBox="0 0 48 48"><rect x="3" y="3" width="42" height="42" rx="9" fill="#111"/><rect x="3" y="3" width="42" height="42" rx="9" fill="none" stroke="#fff" stroke-width="2"/><path transform="translate(12 12) scale(1)" fill="#fff" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
  dex:`<img class="dexlogo" src="dex.png" alt="">`,
  chat:`<svg viewBox="0 0 48 48"><path d="M5 8h26a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H16l-7 6v-6H5a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="#3fbf4f" stroke="#0e5a1a" stroke-width="2"/><path d="M19 20h22a4 4 0 0 1 4 4v11a4 4 0 0 1-4 4h-2v6l-7-6H19a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4z" fill="#3b8cff" stroke="#0b2f80" stroke-width="2"/><circle cx="24" cy="30" r="2" fill="#fff"/><circle cx="30" cy="30" r="2" fill="#fff"/><circle cx="36" cy="30" r="2" fill="#fff"/></svg>`,
  video:`<svg viewBox="0 0 48 48"><rect x="4" y="9" width="40" height="30" rx="3" fill="#f2f2f2" stroke="#333" stroke-width="2"/><rect x="9" y="13" width="30" height="22" fill="#1f6ff0"/><path d="M21 18l9 6-9 6z" fill="#fff"/></svg>`,
  note:`<svg viewBox="0 0 48 48"><rect x="10" y="6" width="28" height="36" fill="#fff" stroke="#333" stroke-width="2"/><path d="M15 15h18M15 21h18M15 27h18M15 33h12" stroke="#7a9cd6" stroke-width="2"/></svg>`,
  pfp:`<svg viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="4" fill="#2f86ff" stroke="#fff" stroke-width="3"/><path d="M4 36q20-8 40 0v8H4z" fill="#3fae3a"/><circle cx="24" cy="26" r="11" fill="#f0a23c" stroke="#2a1a10" stroke-width="2"/><path d="M12 22q12-16 24 0z" fill="#f28aa6" stroke="#2a1a10" stroke-width="2"/></svg>`,
  warn:`<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#2f7cff" stroke="#0b2f80" stroke-width="2"/><rect x="14.2" y="13" width="3.6" height="11" rx="1" fill="#fff"/><circle cx="16" cy="9" r="2.2" fill="#fff"/></svg>`
};


/* ---------- PFP renderer (also used for the icon) ---------- */
const PFP={
  chars:{Shiba:"shiba",Cat:"cat",Frog:"frog",Hippo:"hippo"},
  hats:{None:"none","Pink beanie":"beanie","Party hat":"party",Crown:"crown",Cap:"cap"},
  eyes:{Normal:"normal",Happy:"happy",Shades:"shades","Laser eyes":"laser"},
  extras:{None:"none","Gold chain":"chain",Bowtie:"bow","Diamond":"diamond"},
  bgs:{"XP sky":"sky",Sunset:"sunset","Pump green":"green","Bonk orange":"orange",Night:"night"}
};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function ell(c,x,y,rx,ry,fill,stroke,lw){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.lineWidth=lw||8;c.strokeStyle=stroke;c.stroke()}}
const OUT="#2a1a10";
function drawPFP(c,s){
  const S=512;c.save();c.clearRect(0,0,S,S);
  // background
  const g=c.createLinearGradient(0,0,0,S);
  const B={sky:["#2f86ff","#9fd0ff"],sunset:["#ff8a5c","#ffd28a"],green:["#0f9d58","#7ff0a8"],orange:["#ff7a1a","#ffc46b"],night:["#1b0d3a","#5a2d8c"]}[s.bg];
  g.addColorStop(0,B[0]);g.addColorStop(1,B[1]);c.fillStyle=g;c.fillRect(0,0,S,S);
  if(s.bg==="sky"){c.fillStyle="#3fae3a";c.beginPath();c.moveTo(0,420);c.quadraticCurveTo(256,360,512,430);c.lineTo(512,512);c.lineTo(0,512);c.fill()}

function pfpIcon(size){const cv=document.createElement("canvas");cv.width=cv.height=512;drawPFP(cv.getContext("2d"),{char:"shiba",hat:"beanie",eyes:"normal",extra:"none",bg:"sky"});

const TAPE=[["WIF","dog with a hat"],["BONK","og sol dog"],["POPCAT","pop"],["BOME","$1B in 3 days"],["SLERF","lp burned, still ran"],["MEW","cat in a dogs world"],["MOODENG","baby hippo"],["GOAT","the AI's coin"],["PNUT","justice for peanut"],["CHILLGUY","just chill"],["FWOG","small frog"],["GIGA","gigachad"],["SPX6900","flip the stock market"],["FARTCOIN","yes really"]]
  .map(([t,n])=>`<span><i>▲</i> $${t} <em>${n}</em></span>`).join("");
const STORY=`<h3>When We All Held.</h3>
<p>2024 was a different time in the trenches.</p>
<p>Back when memecoins were simple. No complicated tech, no AI agents, no promises of changing the world. Just a funny picture, a community, and thousands of people believing in the same thing.</p>
<p>We bought random animals, watched charts all night, raided tweets, made memes, and held through every dip because we genuinely believed our bags could become something.</p>
<p>Nobody cared about utility. Nobody needed a roadmap. Sometimes all it took was one meme and a group of people refusing to sell.</p>
<p>Some made life-changing money. Others lost everything. But somehow, we all wanted to be part of it.</p>
<p>It wasn't just about the money. It was about the feeling.</p>
<p>The late nights, the friendships, the runners, the endless hope that the next coin could change your life.</p>
<p>We didn't know it back then, but those were the days we'd look back on.</p>
<p class="end">When we all held.</p>`;

/* right panel: story or pfp maker */

/* PFP maker */
let pfpReady=false;const ps={char:"shiba",hat:"beanie",eyes:"normal",extra:"none",bg:"sky"};
function initPFP(){
  if(pfpReady)return;pfpReady=true;
  const cv=$("#pc"),cx=cv.getContext("2d"),box=$("#popts");
  const groups=[["Character","char",PFP.chars],["Hat","hat",PFP.hats],["Eyes","eyes",PFP.eyes],["Extra","extra",PFP.extras],["Background","bg",PFP.bgs]];
  function build(){box.innerHTML="";groups.forEach(([lab,key,opts])=>{const f=document.createElement("fieldset");f.className="opt";f.innerHTML=`<legend>${lab}</legend><div class="chips"></div>`;
    Object.entries(opts).forEach(([name,val])=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=name;b.setAttribute("aria-pressed",ps[key]===val);
      b.onclick=()=>{ps[key]=val;build();drawPFP(cx,ps)};f.querySelector(".chips").appendChild(b)});box.appendChild(f)})}
  build();drawPFP(cx,ps);
  $("#prand").onclick=()=>{groups.forEach(([,k,o])=>{const v=Object.values(o);ps[k]=v[Math.random()*v.length|0]});build();drawPFP(cx,ps)};
  $("#psave").onclick=()=>{cv.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="nostalgia-pfp.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)})};
}

// keep the music going the whole visit
vid.addEventListener("pause",()=>{if(!vid.ended&&document.visibilityState==="visible"&&!vid.dataset.userPaused)setTimeout(()=>vid.play().catch(()=>{}),400)});

document.body.classList.add("booting");
const fullStory=STORY;
function typeStory(){
  if(reduce){storyEl.innerHTML=fullStory;return}
  const tmp=document.createElement("div");tmp.innerHTML=fullStory;const nodes=[...tmp.children];
  storyEl.innerHTML="";let i=0,j=0,cur=null,skip=false;
  storyEl.addEventListener("click",()=>skip=true,{once:true});
  const caret=document.createElement("span");caret.className="caret";
  (function step(){
    if(skip){storyEl.innerHTML=fullStory;return}
    if(i>=nodes.length){caret.remove();return}
    if(!cur){cur=document.createElement(nodes[i].tagName);cur.className=nodes[i].className;storyEl.appendChild(cur);j=0}
    const t=nodes[i].textContent;j=Math.min(t.length,j+3);cur.textContent=t.slice(0,j);cur.appendChild(caret);
    if(j>=t.length){i++;cur=null;setTimeout(step,140)}else setTimeout(step,16);
    const box=storyEl;if(box.scrollHeight>box.clientHeight)box.scrollTop=box.scrollHeight;
  })();
}
function balloon(){
  const b=document.createElement("div");b.className="balloon";b.setAttribute("role","status");

}
function enter(){
  if(document.body.classList.contains("enter"))return;

  intro.classList.add("gone");setTimeout(()=>intro.remove(),700);
  document.body.classList.remove("booting");document.body.classList.add("enter");
  setTimeout(syncHeight,50);setTimeout(typeStory,700);setTimeout(balloon,1400);
}
$("#enter").onclick=enter;
let booted=false;
function toWelcome(){if(booted)return;booted=true;const bt=$("#boot");bt.style.opacity=0;setTimeout(()=>{bt.remove();$("#welcome").classList.add("on");$("#enter").focus()},450)}
$("#boot").addEventListener("click",enter);
setTimeout(toWelcome,reduce?300:6500);

const clk=$("#clock");function tickClock(){clk.textContent=new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}
